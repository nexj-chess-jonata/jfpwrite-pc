<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>JFPWrite</title>
<link rel="stylesheet" href="style.css">
<style id="print-style"></style>
</head>
<body>
<header id="topbar">
  <div class="row" id="row-file">
    <img src="logo.svg" alt="" class="logo">
    <span class="brand">JFP<span>Write</span></span>
    <button data-act="new" title="Novo documento (Ctrl+N)">Novo</button>
    <button data-act="open" title="Abrir (Ctrl+O)">Abrir</button>
    <button data-act="save" title="Salvar (Ctrl+S)">Salvar</button>
    <button data-act="saveas" title="Salvar como (Ctrl+Shift+S)">Salvar como</button>
    <span class="sep"></span>
    <button data-cmd="undo" title="Desfazer (Ctrl+Z)" aria-label="Desfazer">↶</button>
    <button data-cmd="redo" title="Refazer (Ctrl+Y)" aria-label="Refazer">↷</button>
    <span class="sep"></span>
    <button data-act="review" title="Painel de revisão do português (F7)">Revisão <span id="rv-count"></span></button>
    <button data-act="page" title="Configurar página: tamanho, margens, cabeçalho e rodapé">Página</button>
    <button data-act="export" title="Exportar para Word, PDF, EPUB ou Markdown">Exportar</button>
    <button data-act="print" title="Imprimir ou salvar em PDF (Ctrl+P)">Imprimir / PDF</button>
    <span class="sep"></span>
    <button data-mode="focus" title="Modo foco: só o parágrafo atual em destaque (Ctrl+Shift+F)" aria-pressed="false">Foco</button>
    <button data-mode="tw" title="Máquina de escrever: a linha atual fica sempre no mesmo lugar da tela" aria-pressed="false">Máquina de escrever</button>
    <button data-mode="dark" title="Tema escuro" aria-pressed="false">Escuro</button>
    <span class="grow"></span>
    <span id="docname">Documento sem título</span>
  </div>
  <div class="row" id="row-format">
    <select id="block" title="Estilo do parágrafo" aria-label="Estilo do parágrafo">
      <option value="P">Texto normal</option>
      <option value="H1">Título 1</option>
      <option value="H2">Título 2</option>
      <option value="H3">Título 3</option>
      <option value="BLOCKQUOTE">Citação</option>
    </select>
    <select id="font" title="Fonte" aria-label="Fonte">
      <option value="Georgia, 'Times New Roman', serif">Georgia</option>
      <option value="'Times New Roman', Times, serif">Times New Roman</option>
      <option value="Cambria, Georgia, serif">Cambria</option>
      <option value="Calibri, 'Segoe UI', sans-serif">Calibri</option>
      <option value="Arial, Helvetica, sans-serif">Arial</option>
      <option value="Verdana, Geneva, sans-serif">Verdana</option>
      <option value="'Courier New', Courier, monospace">Courier New</option>
    </select>
    <select id="size" title="Tamanho da letra" aria-label="Tamanho da letra">
      <option>9</option><option>10</option><option>11</option><option selected>12</option><option>14</option>
      <option>16</option><option>18</option><option>20</option><option>24</option><option>28</option><option>36</option><option>48</option>
    </select>
    <select id="lh" title="Espaço entre linhas" aria-label="Espaço entre linhas">
      <option value="1">Linhas 1,0</option><option value="1.15">Linhas 1,15</option><option value="1.5" selected>Linhas 1,5</option><option value="2">Linhas 2,0</option>
    </select>
    <span class="sep"></span>
    <button data-cmd="bold" class="tgl" title="Negrito (Ctrl+B)" aria-label="Negrito"><b>N</b></button>
    <button data-cmd="italic" class="tgl" title="Itálico (Ctrl+I)" aria-label="Itálico"><i>I</i></button>
    <button data-cmd="underline" class="tgl" title="Sublinhado (Ctrl+U)" aria-label="Sublinhado"><u>S</u></button>
    <button data-cmd="strikeThrough" class="tgl" title="Tachado" aria-label="Tachado"><s>T</s></button>
    <label class="color" title="Cor da letra">A<input type="color" id="forecolor" value="#1a1a1a" aria-label="Cor da letra"></label>
    <label class="color mark" title="Cor de realce">▮<input type="color" id="backcolor" value="#fff59d" aria-label="Cor de realce"></label>
    <button data-cmd="removeFormat" title="Limpar formatação">Limpar</button>
    <span class="sep"></span>
    <button data-cmd="justifyLeft" class="tgl" title="Alinhar à esquerda" aria-label="Alinhar à esquerda"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M2 6.5h8M2 10h12M2 13.5h8"/></svg></button>
    <button data-cmd="justifyCenter" class="tgl" title="Centralizar" aria-label="Centralizar"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M4 6.5h8M2 10h12M4 13.5h8"/></svg></button>
    <button data-cmd="justifyRight" class="tgl" title="Alinhar à direita" aria-label="Alinhar à direita"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M6 6.5h8M2 10h12M6 13.5h8"/></svg></button>
    <button data-cmd="justifyFull" class="tgl" title="Justificar" aria-label="Justificar"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12M2 6.5h12M2 10h12M2 13.5h12"/></svg></button>
    <span class="sep"></span>
    <button data-cmd="insertUnorderedList" class="tgl" title="Lista com marcadores">• Lista</button>
    <button data-cmd="insertOrderedList" class="tgl" title="Lista numerada">1. Lista</button>
    <button data-cmd="outdent" title="Diminuir recuo" aria-label="Diminuir recuo">⇤</button>
    <button data-cmd="indent" title="Aumentar recuo" aria-label="Aumentar recuo">⇥</button>
    <span class="sep"></span>
    <button data-act="table" title="Inserir tabela">Tabela</button>
    <button data-act="image" title="Inserir imagem">Imagem</button>
    <button data-act="link" title="Inserir link (Ctrl+K)">Link</button>
  </div>
  <div class="row ctx" id="row-table" hidden>
    <span class="ctxname">Tabela:</span>
    <button data-tb="rowAbove">+ Linha acima</button>
    <button data-tb="rowBelow">+ Linha abaixo</button>
    <button data-tb="colLeft">+ Coluna à esquerda</button>
    <button data-tb="colRight">+ Coluna à direita</button>
    <button data-tb="delRow">Apagar linha</button>
    <button data-tb="delCol">Apagar coluna</button>
    <button data-tb="delTable">Apagar tabela</button>
  </div>
  <div class="row ctx" id="row-image" hidden>
    <span class="ctxname">Imagem:</span>
    <button data-im="25">25%</button>
    <button data-im="50">50%</button>
    <button data-im="75">75%</button>
    <button data-im="100">100%</button>
    <button data-im="left">À esquerda</button>
    <button data-im="center">Ao centro</button>
    <button data-im="right">À direita</button>
    <button data-im="remove">Remover</button>
  </div>
</header>

<div id="work">
<main id="desk">
  <div id="sheet">
    <div id="hdr-preview" class="hf" aria-hidden="true"></div>
    <div id="editor" contenteditable="true" spellcheck="true" lang="pt-BR" role="textbox" aria-multiline="true" aria-label="Texto do documento"></div>
    <div id="ftr-preview" class="hf" aria-hidden="true"></div>
    <div id="marks" aria-hidden="true"></div>
  </div>
</main>
<aside id="review" hidden aria-label="Revisão do texto">
  <div class="rv-head">
    <strong>Revisão</strong>
    <button id="rv-close" aria-label="Fechar painel" title="Fechar">×</button>
  </div>
  <label class="rv-switch"><input type="checkbox" id="rv-on" checked> Revisar enquanto escrevo</label>
  <div id="rv-status" class="rv-status"></div>
  <label class="rv-level">Nível de rigor
    <select id="rv-level" aria-label="Nível de rigor do estilo"></select>
  </label>
  <div id="rv-levelhint" class="rv-status"></div>
  <div id="rv-metrics" class="rv-metrics"></div>
  <div id="rv-tabs"></div>
  <div id="rv-list"></div>
</aside>
</div>

<footer id="status">
  <span id="pageinfo">Página 1 de 1</span>
  <span id="count">0 palavras · 0 caracteres</span>
  <span class="grow"></span>
  <span id="state">Novo documento</span>
</footer>

<div id="hint" hidden></div>
<input type="file" id="pick-image" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
<input type="file" id="pick-doc" accept=".jfpw,.txt,.html,.htm" hidden>

<dialog id="dlg-export">
  <form method="dialog">
    <h2>Exportar documento</h2>
    <div class="choices">
      <button type="button" data-export="docx"><strong>Word (.docx)</strong><span>Abre no Word, LibreOffice e Google Docs, com página, cabeçalho e rodapé.</span></button>
      <button type="button" data-export="pdf"><strong>PDF</strong><span>Abre a tela de impressão do aplicativo para salvar em PDF.</span></button>
      <button type="button" data-export="epub"><strong>Livro digital (.epub)</strong><span>Para leitores como Kindle (via app), Apple Books e Kobo. Cada título 1 vira um capítulo.</span></button>
      <button type="button" data-export="md"><strong>Markdown (.md)</strong><span>Texto simples. Se houver imagens, sai um .zip com elas.</span></button>
    </div>
    <div class="actions"><button value="cancel">Fechar</button></div>
  </form>
</dialog>

<dialog id="dlg-page">
  <form method="dialog">
    <h2>Configurar página</h2>
    <label>Papel
      <select id="p-size"><option value="A4">A4</option><option value="LETTER">Carta</option><option value="A5">A5</option></select>
    </label>
    <label>Orientação
      <select id="p-orient"><option value="portrait">Retrato</option><option value="landscape">Paisagem</option></select>
    </label>
    <label>Margens prontas
      <select id="p-preset">
        <option value="">Personalizada</option>
        <option value="normal">Normal (2,5 cm)</option>
        <option value="abnt">ABNT (3 / 2 / 3 / 2 cm)</option>
        <option value="narrow">Estreita (1,27 cm)</option>
        <option value="wide">Ampla</option>
      </select>
    </label>
    <div class="grid4">
      <label>Superior (cm) <input type="number" id="p-mt" min="0.5" max="6" step="0.1"></label>
      <label>Inferior (cm) <input type="number" id="p-mb" min="0.5" max="6" step="0.1"></label>
      <label>Esquerda (cm) <input type="number" id="p-ml" min="0.5" max="6" step="0.1"></label>
      <label>Direita (cm) <input type="number" id="p-mr" min="0.5" max="6" step="0.1"></label>
    </div>
    <label>Cabeçalho <input type="text" id="p-header" maxlength="120" placeholder="Texto no topo de cada página"></label>
    <label>Rodapé <input type="text" id="p-footer" maxlength="120" placeholder="Texto no pé de cada página"></label>
    <label>Número da página
      <select id="p-number"><option value="none">Sem número</option><option value="center">Centralizado</option><option value="right">À direita</option></select>
    </label>
    <p class="note">Cabeçalho, rodapé e números aparecem ao imprimir ou salvar em PDF.</p>
    <div class="actions">
      <button value="cancel">Cancelar</button>
      <button value="ok" class="primary">Aplicar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-table">
  <form method="dialog">
    <h2>Inserir tabela</h2>
    <label>Linhas <input type="number" id="t-rows" min="1" max="50" value="3"></label>
    <label>Colunas <input type="number" id="t-cols" min="1" max="12" value="3"></label>
    <div class="actions">
      <button value="cancel">Cancelar</button>
      <button value="ok" class="primary">Inserir</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-link">
  <form method="dialog">
    <h2>Inserir link</h2>
    <label>Endereço <input type="text" id="l-url" placeholder="https://"></label>
    <div class="actions">
      <button value="cancel">Cancelar</button>
      <button value="remove">Remover link</button>
      <button value="ok" class="primary">Aplicar</button>
    </div>
  </form>
</dialog>

<dialog id="dlg-ask">
  <form method="dialog">
    <h2 id="ask-title">JFPWrite</h2>
    <p id="ask-text"></p>
    <div class="actions">
      <button value="cancel" id="ask-cancel">Cancelar</button>
      <button value="no" id="ask-no">Não salvar</button>
      <button value="yes" class="primary" id="ask-yes">Salvar</button>
    </div>
  </form>
</dialog>

<script src="page.js"></script>
<script src="rules.js"></script>
<script src="style-rules.js"></script>
<script src="editor.js"></script>
<script src="proofread.js"></script>
<script src="export.js"></script>
</body>
</html>
